name: build-bootmenu

# Cross-compiles the pre-init boot menu binary (static aarch64 musl),
# runs a qemu-user smoke test, and uploads the artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bootmenu/**"
      - ".github/workflows/build-bootmenu.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu for smoke test
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build with zig (static aarch64 musl)
        run: |
          # zig is a single download, reproducible, no musl toolchain setup needed
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          export PATH="$(pwd)/zig-linux-x86_64-0.13.0:$PATH"
          cd bootmenu
          make CC="zig cc -target aarch64-linux-musl" static
          file bootmenu

      - name: Smoke test under qemu-aarch64
        run: |
          cd bootmenu
          file bootmenu
          # must be a static ARM aarch64 executable
          file bootmenu | grep -q "ARM aarch64" || { echo "wrong arch"; exit 1; }
          file bootmenu | grep -qi "statically linked" || { echo "not static"; exit 1; }
          # run under qemu: any exit code is fine (it execs /init.real which does
          # not exist in CI); we just prove it loads and reaches its exec path
          timeout 10 qemu-aarch64-static ./bootmenu || code=$?; echo "exit=${code:-0} (non-zero expected — exec target absent in CI)"

      - uses: actions/upload-artifact@v4
        with:
          name: bootmenu-aarch64-static
          path: bootmenu/bootmenu
