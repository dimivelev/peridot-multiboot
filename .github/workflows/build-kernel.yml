name: build-kernel

# Builds the POCO F6 (peridot) GKI kernel from MiCode peridot-u-oss.
#
# Research-verified decisions (docs/05-github-actions-build.md):
#  - ubuntu-24.04, AOSP clang r530567 from prebuilts main (r487747c unavailable)
#  - config merge: gki_defconfig + vendor/pineapple_GKI.config + vendor/peridot_GKI.config
#    (+ multiboot.config for the multiboot variant)
#  - boot.img: header v4, pagesize 4096, gzipped Image, no DTB/ramdisk (GKI)
#  - tree repair: MiCode export is incomplete (hwid driver + Kconfig sources)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "kernel-patches/**"
      - ".github/workflows/build-kernel.yml"
      - "scripts/repair-kernel-tree.sh"

env:
  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: peridot-u-oss
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz

jobs:
  toolchain:
    name: Fetch + cache AOSP clang
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/cache@v4
        id: clang
        with:
          path: ~/toolchain
          key: clang-r530567-v1
      - name: Download clang if not cached
        if: steps.clang.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$HOME/toolchain"
          curl -fsSL --retry 3 -o /tmp/clang.tar.gz "$CLANG_URL"
          tar -xf /tmp/clang.tar.gz -C "$HOME/toolchain"
      - name: Verify
        run: "$HOME/toolchain/bin/clang --version"

  build:
    name: peridot kernel (${{ matrix.variant }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [multiboot, stock]

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (~31 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false   # keep the 4 GB /mnt swapfile

      - name: Extra swap on /mnt
        run: |
          sudo fallocate -l 8G /mnt/swapfile || true
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile || true
          sudo swapon /mnt/swapfile || true
          free -h; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            ccache curl git cpio zstd
          bash scripts/fetch-android-tools.sh

      - name: Restore clang
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: clang-r530567-v1

      - name: Check clang
        run: "$HOME/toolchain/bin/clang --version"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /mnt/ccache
          key: ccache-peridot-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: ccache-peridot-${{ matrix.variant }}-

      - name: Clone kernel source (shallow)
        run: |
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" \
            "https://github.com/${KERNEL_REPO}.git" kernel_src
          echo "commit: $(git -C kernel_src rev-parse HEAD)"

      - name: Repair incomplete Xiaomi tree (hwid driver + Kconfig stubs)
        run: bash scripts/repair-kernel-tree.sh kernel_src

      - name: Apply multiboot patch
        if: matrix.variant == 'multiboot'
        run: git -C kernel_src apply --verbose ../kernel-patches/0001-peridot-multiboot-config.patch

      - name: Configure (gki + pineapple + peridot [+ multiboot fragment])
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"
          cd kernel_src
          FRAGS="vendor/pineapple_GKI.config vendor/peridot_GKI.config"
          if [ "${{ matrix.variant }}" = "multiboot" ]; then
            FRAGS="$FRAGS vendor/multiboot.config"
          fi
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            gki_defconfig $FRAGS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          echo "=== multiboot-relevant config ==="
          grep -E "CONFIG_KEXEC|SIMPLEDRM|MODULE_SIG_PROTECT|BLK_DEV_LOOP|BOOT_CONFIG|MODULE_SCMVERSION" out/.config || true

      - name: Build Image + gzip
        run: |
          export PATH="$HOME/toolchain/bin:$PATH"
          export KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=peridot
          export CCACHE_COMPILERCHECK="%compiler% -dumpmachine; %compiler% -dumpversion"
          export CCACHE_NOHASHDIR=true CCACHE_HARDLINK=true CCACHE_MAXSIZE=8G
          export CCACHE_DIR=/mnt/ccache
          ccache -s || true
          cd kernel_src
          set -o pipefail
          set +e
          make O=out -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            Image 2>&1 | tee /mnt/build.log | tail -5
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::group::first errors in build log"
            grep -anE "error:|Error [0-9]+|undefined|No such file|cannot find|FATAL|fatal" /mnt/build.log | head -40 || true
            echo "::endgroup::"
            echo "::group::last 60 lines"
            tail -60 /mnt/build.log
            echo "::endgroup::"
            exit "$code"
          fi
          test -f out/arch/arm64/boot/Image || { echo "::error::no Image"; exit 1; }
          gzip -9 -k out/arch/arm64/boot/Image   # -> Image.gz
          ccache -s || true

      - name: Package boot.img (header v4, kernel-only, no DTB — GKI)
        run: |
          cd kernel_src
          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --header_version 4 --os_version 14.0.0 --os_patch_level 2024-08-05 \
            --pagesize 4096 -o "boot-${{ matrix.variant }}.img"
          avbtool add_hash_footer --image "boot-${{ matrix.variant }}.img" \
            --partition_name boot --partition_size $((128*1024*1024)) --algorithm NONE \
            || echo "::warning::avb footer skipped"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp kernel_src/out/arch/arm64/boot/Image dist/
          cp kernel_src/out/arch/arm64/boot/Image.gz dist/
          cp kernel_src/boot-*.img dist/
          cp kernel_src/out/.config dist/kernel-${{ matrix.variant }}.config
          git -C kernel_src rev-parse HEAD > dist/kernel-commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: peridot-${{ matrix.variant }}-${{ github.run_number }}
          path: dist/

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
